name: Collaborative Workflow

on:
  push:
    branches:
      - main

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Update index.html
      - name: Update index.html
        env:
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          echo "GitHub actor: ${{ github.actor }}"
          echo "Commit author: $AUTHOR"
          if [ "$AUTHOR" = "Team Leader" ]; then
            sed -i '/<\/body>/i <p>Updated by Team Leader on '"$(date)"'</p>' index.html
          elif [ "$AUTHOR" = "Member 1" ]; then
            sed -i '/<\/body>/i <p>Updated by Member 1 on '"$(date)"'</p>' index.html
          elif [ "$AUTHOR" = "Member 2" ]; then
            sed -i '/<\/body>/i <p>Updated by Member 2 on '"$(date)"'</p>' index.html
          fi
          cat index.html

      # Step 3: Update README
      - name: Update README
        env:
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          echo "### Updated by ${{ github.actor }} ($AUTHOR) on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md
          cat README.md